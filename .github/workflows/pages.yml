name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: python3 build_site.py

      - name: Validate source tree
        run: python3 validate_site.py

      - name: Test publication gates
        run: python3 -m unittest -v test_site_gates.py

      - name: Set up Node for feedback form tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test local feedback form behaviour
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund --engine-strict
          npm test --prefix tests

      - name: Assemble and validate allowlisted artifact
        run: python3 export_site.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
